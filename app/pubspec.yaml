name: facerate
description: AI face analysis app with animal archetypes
version: 1.0.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.8
  firebase_messaging: ^14.7.19
  google_sign_in: ^6.2.1

  # State & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.1

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7
  google_mlkit_face_detection: ^0.11.0

  # Networking
  dio: ^5.4.1

  # Ads & IAP
  google_mobile_ads: ^5.0.0
  in_app_purchase: ^3.1.13

  # Share & Screenshot
  share_plus: ^9.0.0
  path_provider: ^2.1.2

  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.0
  google_fonts: ^6.2.1
  screen_brightness: ^0.2.2+1

  # Utils
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
