plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Redirect Gradle output to Flutter's expected build directory:
// flutter tool looks for APK at <project>/build/app/outputs/flutter-apk/
layout.buildDirectory = rootProject.file("../build/app")

android {
    namespace "com.facerate.app"
    compileSdk 36

    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.facerate.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true

        // AdMob application id injected into the manifest. Default is Google's
        // official TEST id so debug/CI builds never touch the real ad account.
        // The release build type below overrides this with the production id.
        manifestPlaceholders += [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Production AdMob application id (real ads). Debug keeps the test id.
            manifestPlaceholders += [admobAppId: 'ca-app-pub-6102836677090604~5416784687']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.multidex:multidex:2.0.1'
}
